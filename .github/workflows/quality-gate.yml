
name: Quality Gate CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    name: Inspección de Calidad y Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: taller-casa/fastpay-service

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taller-casa/fastpay-service/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Inspección estática
        run: npm run lint

      - name: Auditoría de seguridad
        run: npm audit --audit-level=high

      - name: Pruebas automatizadas
        run: npm test
